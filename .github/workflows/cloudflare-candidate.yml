# Binds a main SHA to an image digest's Dockerfile blob.
# It does not publish the container and it does not roll traffic back.
# The existing Cloud Run workflow remains the only production publisher.
name: cloudflare-candidate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      git_sha:
        description: 40 character commit that is already on main
        required: true
        type: string
      image_digest:
        description: sha256 image digest built from that commit
        required: true
        type: string
      dockerfile_sha:
        description: git blob SHA of Dockerfile at git_sha
        required: true
        type: string
      isolation:
        description: must be isolated
        required: true
        type: string
        default: isolated
      deploy:
        description: Ignored. A true value makes the bind fail closed.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Test the Worker skeleton
        run: node --test cloudflare/src/*.test.js

      - name: Check the candidate script
        run: bash -n .github/scripts/cloudflare-candidate.sh

      - name: Bind main SHA and digest
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GIT_SHA: ${{ inputs.git_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          DOCKERFILE_SHA: ${{ inputs.dockerfile_sha }}
          ISOLATION: ${{ inputs.isolation }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          git checkout --detach "$GIT_SHA"
          bash .github/scripts/cloudflare-candidate.sh
