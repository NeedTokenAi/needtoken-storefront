# Checks the Worker skeleton on pull request.
# A manual run refuses a hand-filled digest. The image workflow records the registry ref.
# It does not publish the container and it does not roll traffic back.
# The existing Cloud Run workflow remains the only production publisher.
name: cloudflare-candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Test the Worker skeleton
        run: node --test cloudflare/src/*.test.js

      - name: Check the candidate script
        run: bash -n .github/scripts/cloudflare-candidate.sh

      - name: Refuse a hand-filled image digest
        if: github.event_name == 'workflow_dispatch'
        run: |
          printf 'hand-filled SHA or JSON is not a build record\n' >&2
          exit 1
