# Builds and pushes the staging container image, then records the sha256 digest.
# workflow_dispatch only. It does not publish a Worker and it does not select a route.
# Deploy uses the digest. The tag is the immutable source SHA.
name: cloudflare-image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cloudflare-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-image:
    name: Push staging image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      repository: ${{ steps.record.outputs.repository }}
      sha: ${{ steps.record.outputs.sha }}
      run_id: ${{ steps.record.outputs.run_id }}
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Build and push the staging image
        id: build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          tag="needtoken-storefront-staging:${GITHUB_SHA}"
          case ${tag} in
            *:latest|*:main|*:staging)
              printf 'mutable tag is refused\n' >&2
              exit 1
              ;;
          esac
          npx --yes wrangler@4 containers build -p -t "${tag}" .
          raw=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${tag}")
          digest=$(printf '%s\n' "${raw}" | sed -n 's/.*@\(sha256:[0-9a-f]\{64\}\)$/\1/p' | head -n 1)
          unset raw
          if [[ ! ${digest} =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'pushed image did not yield a sha256 digest\n' >&2
            exit 1
          fi
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

      - name: Record the build
        id: record
        env:
          BUILD_REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_SOURCE: github-actions
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash .github/scripts/cloudflare-image-record.sh

      - name: Upload the build record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-image-build-record
          path: build-record.txt
          if-no-files-found: error
