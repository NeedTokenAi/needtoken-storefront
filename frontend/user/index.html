  <script data-cfasync="false">
    (() => {
      try {
        const stored = localStorage.getItem('dujiao_theme');
        const pref = stored === 'dark' || stored === 'light' ? stored : 'light dark';
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.setAttribute('content', pref);
        const isDark = pref === 'dark' || (pref === 'light dark' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      } catch { /* Follow system color-scheme when storage is unavailable. */ }

      const mainHost = location.hostname === 'needtoken.ai' || location.hostname === 'www.needtoken.ai';
      let brandNeedtoken = mainHost;
      try {
        const param = new URLSearchParams(location.search).get('template');
        const override = ['classic', 'vault', 'needtoken'].includes(param) ? param : param === 'reset' ? null : localStorage.getItem('dj-storefront-template');
        const template = override || localStorage.getItem('dj-storefront-template-last');
        if (!mainHost && template === 'needtoken' && localStorage.getItem('dj-storefront-boot-main') === '1') {
          brandNeedtoken = true;
        }
        const lang = localStorage.getItem('locale') || navigator.language || 'zh-CN';
        document.documentElement.dataset.bootLocale = /^(zh-TW|zh-HK|zh-Hant)/i.test(lang) ? 'zh-TW' : /^en/i.test(lang) ? 'en-US' : 'zh-CN';
      } catch { /* Unknown tenants retain neutral startup placeholders. */ }

      if (/^\/me(?:\/|$)/.test(location.pathname)) {
        document.documentElement.dataset.bootLayout = 'console';
      }

      if (brandNeedtoken) {
        document.documentElement.dataset.bootBrand = 'needtoken';
        document.title = 'NeedToken.AI';
        const appendHeadLink = attrs => {
          const link = document.createElement('link');
          link.dataset.ntBootHead = '1';
          Object.entries(attrs).forEach(([key, value]) => link.setAttribute(key, value));
          document.head.appendChild(link);
        };
        appendHeadLink({ rel: 'icon', type: 'image/svg+xml', href: '/needtoken-icon.svg' });
        appendHeadLink({ rel: 'icon', sizes: 'any', href: '/needtoken.ico' });
        appendHeadLink({ rel: 'apple-touch-icon', href: '/needtoken-touch.png' });
      }
    })();
  </script>

  <script data-cfasync="false">
    (() => {
      const root = document.getElementById('nt-preboot');
      const timer = window.setTimeout(() => { if (root?.isConnected) root.dataset.slow = '1'; }, 8000);
      const retry = () => location.reload();
      root?.querySelector('.nt-preboot-retry')?.addEventListener('click', retry);
      const onError = event => {
        if (event.target instanceof HTMLScriptElement && (event.target.hasAttribute('data-app-entry') || (event.target.type === 'module' && /\/assets\/index[-.][^/]+\.js(?:\?|$)/.test(event.target.src))) && root?.isConnected) {
          root.dataset.failed = '1'; root.setAttribute('aria-busy', 'false'); root.setAttribute('role', 'alert');
        }
      };
      window.addEventListener('error', onError, true);
      window.addEventListener('storefront:mounted', () => {
        clearTimeout(timer); window.removeEventListener('error', onError, true);
        root?.querySelector('.nt-preboot-retry')?.removeEventListener('click', retry);
        delete document.documentElement.dataset.bootBrand; delete document.documentElement.dataset.bootLocale; delete document.documentElement.dataset.bootLayout;
      }, { once: true });
    })();
  </script>
  <script type="module" data-cfasync="false" data-app-entry src="/src/main.ts"></script>
